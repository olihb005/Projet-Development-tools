<!doctype html><meta charset='utf-8'><title>__TITLE__</title>
<style>
:root{--paper:#f3ecdf;--card:#fbf7ee;--ink:#231d17;--mute:#7d7265;--line:#d9cdb8;--terra:#c5533b;--ochre:#d99a2b;--sage:#5f8f6e;--indigo:#3b4d80;--plum:#7b4a70;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif}
*{box-sizing:border-box}body{font:14.5px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;margin:0;color:var(--ink);background:radial-gradient(620px 420px at 6% -4%,#efc3a0aa,transparent 70%),radial-gradient(760px 520px at 102% 8%,#c3d6c2aa,transparent 70%),radial-gradient(700px 500px at 50% 110%,#cdc6e6aa,transparent 70%),var(--paper);background-attachment:fixed}
.wrap{max-width:1360px;margin:0 auto;padding:24px 26px 60px}header{display:flex;align-items:flex-end;gap:26px;margin-bottom:16px}h1{font:italic 600 40px/1 var(--serif);margin:0;letter-spacing:-.5px}

.card{background:var(--card);border:1.5px solid var(--ink);border-radius:16px;padding:16px 18px;box-shadow:5px 5px 0 #231d1722}.grid{display:grid;gap:18px;margin-top:18px}.g2{grid-template-columns:1.5fr 1fr}.g6{grid-template-columns:repeat(6,1fr)}.g3{grid-template-columns:1fr 1fr 1.3fr}
.kpis{display:flex;gap:26px;flex:1;justify-content:flex-end}.k b{display:block;font:600 30px/1 var(--serif)}.k span{color:var(--mute);font-size:12px}
#g{width:100%;display:block;background:var(--card);border:1.5px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 #231d1722}
#g text{font-family:inherit}.cap{font:italic 600 30px var(--serif);fill:#231d17;opacity:.1}.nm{font-weight:700;font-size:12.5px}.sub{font-size:11.5px;fill:#4a4035}.tok{font-size:11.5px;fill:var(--ink)}.hd{font:italic 600 20px var(--serif)}
.ed{pointer-events:stroke;cursor:help;transition:opacity .15s}.ed:hover{stroke-width:4;stroke-opacity:1}#g.tr .ed,#g.tr .node{opacity:.12}#g.tr .ed.hot{opacity:1;stroke-width:3.5;stroke-opacity:1}#g.tr .node.hot{opacity:1}
.node{cursor:pointer}.node:hover .ring{stroke-width:4}.node.sel .ring{stroke-width:5}.breathe{animation:br 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes br{0%,100%{transform:scale(.85);opacity:.12}50%{transform:scale(1.15);opacity:.3}}
.ping .ring{animation:pg .9s ease-out 1}@keyframes pg{0%{stroke:var(--terra);stroke-width:8}100%{}}.woke .ring{animation:wk 2.4s ease-out 1}@keyframes wk{0%{stroke:var(--sage);stroke-width:11}100%{}}
#panel{margin-top:14px;display:none}#panel.on{display:block}#panel .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:10px}.act{padding:5px 0 5px 14px;border-left:2px solid var(--line);font-size:12.5px;position:relative}.act:before{content:'';position:absolute;left:-5px;top:11px;width:8px;height:8px;border-radius:50%;background:var(--ochre)}.act:last-child:before{background:var(--terra)}
#feed{height:400px;overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:4px}.m{background:#fff;border:1px solid var(--line);border-radius:14px 14px 14px 3px;padding:7px 11px;font-size:13px}.m.a{background:none;border:0;color:var(--mute);padding:0 11px;font-size:12px}.m.new{animation:fl 1.6s ease-out 1}@keyframes fl{0%{background:#f6d9a6}100%{}}
.chip{display:inline-block;border-radius:99px;padding:0 9px;font-size:11.5px;font-weight:700;color:#fff;background:var(--ink);margin-right:4px}.chip.c{background:var(--terra)}.chip.mg{background:var(--indigo)}.chip.w{background:var(--sage)}.chip.v{background:var(--plum)}.hm{color:var(--mute);font-size:11.5px;margin-right:6px}
.dcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}.d{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}.d b{font:600 17px/1.2 var(--serif)}.d .big{font:600 44px/1 var(--serif);color:var(--terra)}.d .big small{font-size:15px}.d p{margin:0;font-size:12.5px;color:#4a4035}.d img{width:100%;border-radius:8px;border:1px solid var(--line);background:#fff;max-height:220px;object-fit:contain}

table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600;font-size:11.5px}

.lanes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}.lane b{font:italic 600 16px var(--serif)}.tk{display:inline-block;margin:4px 4px 0 0;padding:3px 10px;border-radius:99px;border:1.3px solid var(--ink);font-size:12px;background:#fff}.tk.w{background:#dcebdd}.tk.h{background:var(--sage);color:#fff;border-color:var(--sage)}.tk.p{background:var(--ochre);color:#fff;border-color:var(--ochre)}.tk.n{background:var(--terra);color:#fff;border-color:var(--terra)}
#live{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--terra);margin-left:10px;vertical-align:middle}
</style>
<div class='wrap'><header><h1>__TITLE__<span id='live'></span></h1><div id='kpi' class='kpis'></div><div id='rings' style='display:flex;gap:14px'></div></header>
<svg id='g' viewBox='0 0 1240 640'></svg><div id='panel' class='card'></div>
<div class='grid g2'><div class='card'><h2>Headlines</h2><div id='deliv' class='dcards'></div></div><div class='card'><h2>Messages <small id='rate'></small></h2><div id='c_mpm'></div><div id='feed'></div></div></div>
<div class='card' style='margin-top:18px'><h2>Slices</h2><div id='lanes' class='lanes'></div></div>
<div class='grid g2'><div class='card'><h2>The product by itself <small id='scw'></small></h2><div id='score'></div></div><div class='card'><h2>The evening</h2><div id='tl'></div><div id='c_who' style='margin-top:10px'></div></div></div>
<div class='grid g6' id='charts'></div></div>
<script>
const esc=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;');let NOW={},ST={},PU={},POS={},MSG=[],sel=localStorage.getItem('sel'),prevState={},lastSvg='';const $=id=>document.getElementById(id);
const C={terra:'#c5533b',ochre:'#d99a2b',sage:'#5f8f6e',indigo:'#3b4d80',plum:'#7b4a70',ink:'#231d17',card:'#fbf7ee'},RC={chief:C.terra,manager:C.indigo,worker:C.ink,verifier:C.plum};
const WORD={live:'working now',slow:'quiet for a few minutes',idle:'idle: a message wakes it'};
const tagOf=t=>{t=(t||'').replace(/^\s*[A-Z]{1,3}\d*[a-z]?(-\d+)?\s+/,'').split(/[:(;]| - /)[0].trim();const w=t.split(/\s+/);return w.slice(0,5).join(' ')+(w.length>5?'…':'');};
const chip=n=>`<span class='chip ${n=='chief'?'c':n=='manager'?'mg':/^w-/.test(n)||n=='workers'?'w':/^v-/.test(n)||n=='verifiers'?'v':''}'>${esc(n)}</span>`;
const wrap=(t,n)=>{const w=(t||'').split(/\s+/),L=[''];w.forEach(x=>{if((L[L.length-1]+' '+x).trim().length>n&&L[L.length-1])L.push(x);else L[L.length-1]=(L[L.length-1]+' '+x).trim();});if(L.length>2){L[1]=L[1].slice(0,n-1)+'…';L.length=2;}return L;};
function layout(){const a=ST.agents||[];POS={main:[620,46],queue:[120,150],product:[1120,150]};const ring=(it,cx,cy,rx,ry)=>{const n=it.length;it.forEach((x,i)=>{const g=-Math.PI/2+2*Math.PI*i/n;POS[x.name]=n==1?[cx,cy]:[cx+rx*Math.cos(g),cy+ry*Math.sin(g)];});};
 const ch=a.filter(x=>x.role=='chief'),mg=a.filter(x=>x.role=='manager'),w=a.filter(x=>x.role=='worker'),v=a.filter(x=>x.role=='verifier');ch.forEach(x=>POS[x.name]=[350,235]);mg.forEach(x=>POS[x.name]=[350,455]);ring(w,640,350,w.length>2?140:0,168);ring(v,930,350,v.length>2?70:0,105);return {w,v,ch:ch[0],mg:mg[0]};}
const HW=[640,350],HV=[930,350],PIN=[1024,300],QOUT=[216,300],LOOP='M1120,440 C1120,625 900,620 620,620 C340,620 120,625 120,440',TOMAIN='M1120,122 C1120,60 940,46 710,46',ln=(a,b)=>`M${a[0]},${a[1]} L${b[0]},${b[1]}`,hc=(a,b)=>{const dx=b[0]-a[0];return Math.abs(dx)<30?ln(a,b):`M${a[0]},${a[1]} C${a[0]+dx/2},${a[1]} ${b[0]-dx/2},${b[1]} ${b[0]},${b[1]}`;};
function targets(m){const a=(ST.agents||[]).map(x=>x.name);if(m.to=='all')return ['main',...a].filter(n=>n!=m.from);if(m.to=='verifiers')return a.filter(n=>n.startsWith('v-'));if(m.to=='workers')return a.filter(n=>n.startsWith('w-'));return [m.to];}
function draw(){if(!ST.agents)return;const {w,v,ch,mg}=layout(),g=[],names=new Set(ST.agents.map(x=>x.name));let wi=0;
 const NM={main:'Main session',queue:'the queue',product:'the product',chief:'the chief',manager:'the manager',hubw:'all workers',hubv:'all verifiers'},nm=k=>NM[k]||k;
 const wire=(d,a,b,col,label,lx,ly)=>{g.push(`<path class='ed' data-a='${a}' data-b='${b}' d='${d}' fill='none' stroke='${col}' stroke-opacity='.6' stroke-width='1.8' stroke-linecap='round'><title>work: ${nm(a)} → ${nm(b)}</title></path>`+(label?`<text x='${lx}' y='${ly}' text-anchor='middle' class='s' style='font-style:italic;fill:${C.terra}'>${label}</text>`:''));};
 g.push(`<text x='350' y='355' text-anchor='middle' class='cap'>direction</text><text x='640' y='360' text-anchor='middle' class='cap'>workers</text><text x='930' y='360' text-anchor='middle' class='cap'>verifiers</text>`);
 const now=Date.now()/1000,pair={};MSG.filter(m=>now-m.t<900&&m.to!='all').forEach(m=>targets(m).forEach(t=>{if(POS[m.from]&&POS[t]&&m.from!=t){const k=[m.from,t].sort().join('|');pair[k]=(pair[k]||0)+1;}}));
 Object.entries(pair).forEach(([k,c])=>{const [a,b]=k.split('|');g.push(`<line class='ed' data-a='${a}' data-b='${b}' x1='${POS[a][0]}' y1='${POS[a][1]}' x2='${POS[b][0]}' y2='${POS[b][1]}' stroke='${C.indigo}' stroke-opacity='${Math.min(.25+c*.05,.75)}' stroke-width='1.3' stroke-dasharray='2 6' stroke-linecap='round'><title>messages: ${nm(a)} ↔ ${nm(b)}, ${c} in the last 15 minutes</title></line>`);});
 const QY=176,ready=(ST.ready||[]).slice(0,7),ver=(ST.verd||[]).slice(0,7);
 wire(`M530,46 C300,46 120,60 120,122`,'main','queue',C.ink);if(ch)wire(`M590,66 C560,150 430,150 ${POS.chief[0]+10},${POS.chief[1]-30}`,'main','chief',C.ink);
 wire(TOMAIN,'product','main',C.sage,(ST.nunp||0)?(ST.nunp+' to approve'):'',985,36);
 if(ch)wire(hc(QOUT,POS.chief),'queue','chief',C.ochre);if(ch&&mg)wire(hc(POS.chief,POS.manager),'chief','manager',C.terra);
 [ch,mg].forEach(x=>{if(x){const col=x.role=='chief'?C.terra:C.indigo;wire(hc(POS[x.name],HW),x.name,'hubw',col);wire(`M${POS[x.name][0]},${POS[x.name][1]} C${POS[x.name][0]+200},${x.role=='chief'?120:580} ${HV[0]-160},${x.role=='chief'?150:550} ${HV[0]},${HV[1]}`,x.name,'hubv',col);}});
 w.forEach(x=>wire(ln(HW,POS[x.name]),'hubw',x.name,C.ink));v.forEach(x=>wire(ln(HV,POS[x.name]),'hubv',x.name,C.plum));wire(ln(HW,HV),'hubw','hubv',C.ink);wire(hc(HV,PIN),'hubv','product',C.sage);
 g.push(`<circle cx='${HW[0]}' cy='${HW[1]}' r='7' fill='${C.ink}'><title>all workers</title></circle><circle cx='${HV[0]}' cy='${HV[1]}' r='7' fill='${C.plum}'><title>all verifiers</title></circle>`);
 wire(LOOP,'product','queue',C.ochre,'what is left goes back into the queue',620,611);
 const stack=(key,x,title,count,items,fn)=>`<g class='node${sel==key?' sel':''}' data-n='${key}' id='n_${key}'><text x='${x}' y='150' text-anchor='middle' class='hd'>${title} <tspan style='fill:${C.terra}'>${count}</tspan></text><rect class='ring' x='${x-96}' y='${QY-12}' width='192' height='${Math.max(items.length,1)*32+18}' rx='18' fill='none' stroke='${C.ink}' stroke-width='1.5'/>`+items.map((it,i)=>fn(it,x,QY+i*32)).join('')+`</g>`;
 const tok=(txt,x,y,dot)=>`<rect x='${x-86}' y='${y}' width='172' height='25' rx='12.5' fill='#fff' stroke='${C.ink}' stroke-opacity='.35'/>${dot?`<circle cx='${x-73}' cy='${y+12.5}' r='5' fill='${dot}'/>`:''}<text x='${x-(dot?62:76)}' y='${y+16.5}' class='tok'>${esc(txt.slice(0,dot?24:26))}</text>`;
 g.push(stack('queue',120,'Queue',ST.nready,ready,(it,x,y)=>tok(it.tag||tagOf(it.title),x,y)));if(ST.nready>7)g.push(`<text x='120' y='${QY+7*32+26}' text-anchor='middle' class='s'>and ${ST.nready-7} more</text>`);
 g.push(stack('product',1120,'Product',ST.holds,ver,(it,x,y)=>tok(it.tag||it.id,x,y,it.v=='holds'?C.sage:it.v=='partly'?C.ochre:C.terra)));g.push(`<text x='1120' y='${QY+7*32+26}' text-anchor='middle' class='s'>${ST.ncom} changes this evening</text>`);
 g.push(`<g class='node${sel=='main'?' sel':''}' data-n='main' id='n_main'><rect class='ring' x='530' y='24' width='180' height='44' rx='22' fill='${C.ink}' stroke='${C.ink}'/><text x='620' y='51' text-anchor='middle' style='fill:#fbf7ee;font:italic 600 17px var(--serif)'>Main session</text></g>`);
 ST.agents.forEach(a=>{const st=(PU[a.name]||{}).state||'idle',[x,y]=POS[a.name],big=a.role=='chief'||a.role=='manager',r=big?34:23,fill=st=='live'?C.sage:st=='slow'?C.ochre:C.card,tc=st=='idle'?C.ink:'#fff',lab=a.role=='chief'?'Chief':a.role=='manager'?'Manager':a.name,nw=NOW[a.name],L=wrap(nw&&nw.until>Date.now()?nw.text:(st=='live'?(a.tag||'working'):'quiet'),21);
  g.push(`<g class='node${sel==a.name?' sel':''}' data-n='${a.name}' id='n_${a.name}'>${st=='live'?`<circle class='breathe' cx='${x}' cy='${y}' r='${r+9}' fill='${C.sage}'/>`:''}<circle class='ring' cx='${x}' cy='${y}' r='${r}' fill='${fill}' stroke='${RC[a.role]||C.ink}' stroke-width='2.5' ${st=='idle'?"stroke-dasharray='4 4'":''}/><text x='${x}' y='${y+4.5}' text-anchor='middle' class='nm' style='fill:${tc}'>${esc(lab)}</text>`+L.map((t,i)=>`<text x='${x}' y='${y+r+15+i*14}' text-anchor='middle' class='sub' style='paint-order:stroke;stroke:${C.card};stroke-width:4px'>${esc(t)}</text>`).join('')+`</g>`);});
 const html=g.join('');if(html!=lastSvg){lastSvg=html;$('g').innerHTML=html+`<g id='fly'></g>`;document.querySelectorAll('.node').forEach(n=>{n.onclick=()=>show(n.dataset.n);n.onmouseenter=()=>trace(n.dataset.n);n.onmouseleave=()=>trace(null);});document.querySelectorAll('.ed').forEach(e=>{e.onmouseenter=()=>{$('g').classList.add('tr');e.classList.add('hot');[e.dataset.a,e.dataset.b].forEach(k=>{const n=$('n_'+k);n&&n.classList.add('hot');});};e.onmouseleave=()=>trace(null);});}
 Object.entries(PU).forEach(([n,p])=>{if(prevState[n]&&prevState[n]!='live'&&p.state=='live'){const e=$('n_'+n);e&&e.classList.add('woke');}prevState[n]=p.state;});
 const live=Object.values(PU).filter(p=>p.state=='live').length,k=(n,t)=>`<div class='k'><b>${n}</b><span>${t}</span></div>`;
 $('kpi').innerHTML=k(live+'<small> of '+ST.agents.length+'</small>','agents working')+k((ST.prog||[]).length,'slices in work')+k(ST.nbuilt,'built')+k(ST.holds+'<small> of '+ST.nverd+'</small>','checks passed')+k(ST.nunp||0,'to approve');
 const Cc=2*Math.PI*24,ring=(p,c,l)=>`<svg viewBox='0 0 64 64' width='64'><title>${l}</title><circle cx='32' cy='32' r='24' fill='none' stroke='#e2d8c6' stroke-width='6'/><circle cx='32' cy='32' r='24' fill='none' stroke='${c}' stroke-width='6' stroke-linecap='round' stroke-dasharray='${Cc*Math.min(p,100)/100} ${Cc}' transform='rotate(-90 32 32)'/><text x='32' y='30' text-anchor='middle' style='font:600 14px var(--serif)'>${Math.round(p)}%</text><text x='32' y='42' text-anchor='middle' style='font-size:8px;fill:#7d7265'>${l.split(' ')[0]}</text></svg>`;
 const u=ST.usage||{};$('rings').innerHTML=ring(u.five||0,(u.five||0)<90?C.sage:C.terra,'window, resets '+u.reset)+ring(u.seven||0,(u.seven||0)<80?C.indigo:C.terra,'week, stop line 90%');rest();if(sel)show(sel,true);}
function trace(n){const G=$('g');G.classList.toggle('tr',!!n);document.querySelectorAll('.ed.hot,.node.hot').forEach(e=>e.classList.remove('hot'));if(!n)return;const hub=/^w-/.test(n)?'hubw':/^v-/.test(n)?'hubv':null;const me=$('n_'+n);me&&me.classList.add('hot');
 document.querySelectorAll('.ed').forEach(e=>{const a=e.dataset.a,b=e.dataset.b,dir=a==n||b==n,trunk=hub&&(a==hub||b==hub)&&!/^[wv]-/.test(a)&&!/^[wv]-/.test(b);if(dir||trunk){e.classList.add('hot');[a,b].forEach(k=>{const o=$('n_'+k);o&&o.classList.add('hot');});}});}
function mins(hm){let m=+hm.slice(0,2)*60+ +hm.slice(3,5);return m<720?m+1440:m;}
function rest(){
 const lane=(t,n,items)=>`<div class='lane'><b>${t}</b> <small>${n}</small><div>${items||'<small>none</small>'}</div></div>`;
 $('lanes').innerHTML=lane('Ready',ST.nready,(ST.ready||[]).map(p=>`<span class='tk' title='${esc(p.title)}'>${esc(p.tag||tagOf(p.title))}</span>`).join(''))+lane('In work',(ST.prog||[]).length,(ST.prog||[]).map(p=>`<span class='tk w' title='${esc(p.title)}'>${chip(p.who||'?')}${esc(p.tag||tagOf(p.title))}</span>`).join(''))+lane('Checked',ST.nverd,(ST.verd||[]).slice(0,24).map(v=>`<span class='tk ${v.v=='holds'?'h':v.v=='partly'?'p':'n'}' title='${esc(v.v+' · '+v.by+' · '+v.text)}'>${esc(v.tag||v.id)}</span>`).join(''));
 const sc=ST.score||{rows:[]};$('scw').textContent=sc.when?sc.when:'';
 $('score').innerHTML=sc.rows.length?`<table><tr><th>Sheet</th><th style='width:36%'>Homes found of printed</th><th>Gardens</th><th>Bays</th><th>Edits</th><th>Export</th><th>Seconds</th></tr>`+sc.rows.map(r=>{const pc=r.printed?Math.min(100,100*r.homes/r.printed):0,ok=r.state=='done';return `<tr><td><b>${esc(r.sheet)}</b></td><td>${ok?`<b style='font:600 19px var(--serif)'>${r.homes??'–'}</b> <small>of ${r.printed??'?'}</small><div class='bar'><i style='width:${pc}%;${pc<99.5?'background:var(--ochre)':''}'></i></div>`:`<span class='pill no'>${esc(r.state)}</span>`}</td><td>${r.gardens??'–'}</td><td>${r.bays??'–'}</td><td>${r.edits?`<span class='pill ${r.failed?'pa':'ok'}'>${r.made} of ${r.edits}</span>`:'–'}</td><td>${r.export==null?'–':`<span class='pill ${r.export?'ok':'no'}'>${r.export?'yes':'no'}</span>`}</td><td>${r.seconds!=null?`${r.seconds.toFixed(0)}<div class='bar'><i style='width:${Math.min(100,r.seconds/1.8)}%;${r.seconds>90?'background:var(--terra)':''}'></i></div>`:'–'}</td></tr>`;}).join('')+'</table>':'<small>no run yet</small>';
 $('deliv').innerHTML=(ST.deliv||[]).map(d=>{const u=d.path?'/file?p='+encodeURIComponent(d.path):'',ext=(d.path||'').split('.').pop().toLowerCase(),m=(d.title+' '+d.text).match(/(\d+)\s+of\s+(\d+)/);
  return `<div class='d'><div><span class='hm'>${esc(d.hm)}</span>${chip(d.by)}</div><b>${esc(d.title)}</b>${m?`<div class='big'>${m[1]} <small>of ${m[2]}</small></div><div class='bar'><i style='width:${Math.min(100,100*m[1]/m[2])}%'></i></div>`:''}${u&&['svg','png','jpg'].includes(ext)?`<a href='${u}' target='_blank'><img src='${u}'></a>`:''}<p>${esc(d.text)}</p>${u&&!['svg','png','jpg'].includes(ext)?`<a href='${u}' target='_blank' style='font-size:12px;color:var(--terra)'>open the file</a>`:''}</div>`;}).join('')||'<small>nothing posted yet</small>';
 const t0=mins(ST.since||'00:00'),d=new Date(),t1=Math.max(mins(String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')),t0+30),X=hm=>40+540*(mins(hm)-t0)/(t1-t0);let s=`<svg viewBox='0 0 600 96' width='100%'><line x1='40' x2='580' y1='28' y2='28' stroke='#d9cdb8'/><line x1='40' x2='580' y1='62' y2='62' stroke='#d9cdb8'/><text x='0' y='32' class='s'>checks</text><text x='0' y='66' class='s'>changes</text>`;
 (ST.verd||[]).forEach(v=>s+=`<circle cx='${X(v.hm)}' cy='28' r='6' fill='${v.v=='holds'?C.sage:v.v=='partly'?C.ochre:C.terra}' fill-opacity='.85'><title>${esc(v.hm+' '+v.v+': '+(v.tag||v.id))}</title></circle>`);
 (ST.commits||[]).forEach(c=>s+=`<rect x='${X(c.hm)-4}' y='53' width='8' height='18' rx='3' fill='${c.wait?'none':C.indigo}' stroke='${C.indigo}' stroke-width='1.5'><title>${esc(c.hm+' '+(c.wait?'to approve: ':'pushed: ')+c.s)}</title></rect>`);
 for(let m=Math.ceil(t0/30)*30;m<=t1;m+=30)s+=`<text x='${40+540*(m-t0)/(t1-t0)}' y='92' text-anchor='middle' class='s'>${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}</text>`;$('tl').innerHTML=s+'</svg>';charts();}
function line(v,t,c,h){const w=220;if(!v||v.length<2)return '';const mx=Math.max(...v,1),t0=t[0],t1=Math.max(t[t.length-1],t0+1),P=v.map((b,i)=>[4+(w-8)*(t[i]-t0)/(t1-t0),h-6-(h-22)*b/mx]),L=P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');return `<svg viewBox='0 0 ${w} ${h}' width='100%'><polygon points='4,${h-6} ${L} ${P[P.length-1][0]},${h-6}' fill='${c}' opacity='.18'/><polyline points='${L}' fill='none' stroke='${c}' stroke-width='2.2' stroke-linejoin='round'/><circle cx='${P[P.length-1][0]}' cy='${P[P.length-1][1]}' r='3.5' fill='${c}'/></svg>`;}
function charts(){const H=ST.hist||[],t=H.map(x=>x.t),card=(l,k,c,suf)=>`<div class='card' style='padding:12px 14px'><small>${l}</small><div style='font:600 26px var(--serif)'>${H.length?H[H.length-1][k]:'–'}${suf||''}</div>${line(H.map(x=>x[k]),t,c,54)}</div>`;
 $('charts').innerHTML=card('agents working','live',C.sage)+card('slices in work','work',C.indigo)+card('slices built','built',C.ink)+card('checks passed','holds',C.sage)+card('window used','u',C.terra,'%')+card('week used','w',C.plum,'%');
 const now=Date.now()/1000,B=Array(30).fill(0),A=Array(30).fill(0);MSG.forEach(m=>{const k=29-Math.floor((now-m.t)/60);if(k>=0&&k<30)(m.auto?A:B)[k]++;});const mx=Math.max(...B.map((b,i)=>b+A[i]),1);
 $('c_mpm').innerHTML=`<svg viewBox='0 0 300 54' width='100%' style='margin-bottom:8px'>`+B.map((b,i)=>{const hb=46*b/mx,ha=46*A[i]/mx,x=3+i*9.9;return `<rect x='${x}' y='${50-ha}' width='7.6' height='${ha}' rx='2' fill='${C.indigo}' opacity='.45'/><rect x='${x}' y='${50-ha-hb}' width='7.6' height='${hb}' rx='2' fill='${C.terra}'/>`;}).join('')+`</svg>`;
 const by={};MSG.filter(m=>now-m.t<1800).forEach(m=>{by[m.from]=by[m.from]||[0,0];by[m.from][m.auto?1:0]++;});const E=Object.entries(by).sort((a,b)=>(b[1][0]+b[1][1])-(a[1][0]+a[1][1])).slice(0,9),m2=Math.max(...E.map(e=>e[1][0]+e[1][1]),1);
 $('c_who').innerHTML=`<svg viewBox='0 0 420 ${E.length*22+4}' width='100%'>`+E.map((e,i)=>{const a=270*e[1][0]/m2,b=270*e[1][1]/m2;return `<text x='66' y='${i*22+15}' text-anchor='end' style='font-size:12.5px'>${esc(e[0])}</text><rect x='76' y='${i*22+5}' width='${a}' height='12' rx='6' fill='${C.terra}'/><rect x='${76+a}' y='${i*22+5}' width='${b}' height='12' rx='6' fill='${C.indigo}' opacity='.45'/><text x='${84+a+b}' y='${i*22+15}' class='s'>${e[1][0]+e[1][1]}</text>`;}).join('')+`</svg>`;}
function show(k,quiet){sel=k;localStorage.setItem('sel',k);const a=(ST.agents||[]).find(x=>x.name==k),p=PU[k]||{};let title=k,state='',slice='',acts=[];
 const mm=MSG.filter(m=>m.from==k||targets(m).includes(k)).slice(-8).reverse();
 if(a){title={chief:'Chief of staff',manager:'Manager'}[a.role]||(a.role=='worker'?'Worker ':'Verifier ')+a.name;state=WORD[p.state||'idle']+(p.ago!=null?', last action '+(p.ago<1?'just now':p.ago+' min ago'):'');slice=a.slice.replace(/^\S+\s+/,'');acts=a.acts;}
 else if(k=='queue'){title='The queue';acts=(ST.ready||[]).map(x=>x.title);}else if(k=='product'){title='The product';acts=(ST.commits||[]).map(c=>(c.wait?'to approve: ':'pushed: ')+c.s);}else if(k=='main'){title='Main session';state='directs, approves and pushes';}
 $('panel').className='card on';$('panel').innerHTML=`<h2 style='margin:0;font-size:26px'>${esc(title)} <small style='font:13px system-ui'>${esc(state)}</small></h2>${slice?`<p style='margin:8px 0 0;font-size:16px'>${esc(slice)}</p>`:''}<div class='cols'><div>${acts.slice(-7).map(x=>`<div class='act'>${esc(x)}</div>`).join('')||'<small>nothing yet</small>'}</div><div style='display:flex;flex-direction:column;gap:6px'>${mm.map(m=>`<div class='m'><span class='hm'>${m.hm}</span>${chip(m.from)}→ ${chip(m.to)}${esc(m.text.slice(0,260))}</div>`).join('')||'<small>no messages</small>'}</div></div>`;
 if(!quiet)document.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel',n.dataset.n===k));}
function fly(m){targets(m).forEach((t,i)=>{if(!POS[m.from]||!POS[t])return;const A=POS[m.from],B=POS[t],c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r',m.auto?4:6);c.setAttribute('fill',m.auto?C.indigo:C.ochre);c.setAttribute('stroke',C.ink);const f=$('fly');if(!f)return;f.appendChild(c);const t0=performance.now()+i*60,D=900;
 (function step(now){let u=(now-t0)/D;if(u<0){requestAnimationFrame(step);return;}if(u>=1){c.remove();const e=$('n_'+t);if(e){e.classList.remove('ping');void e.getBBox();e.classList.add('ping');}return;}u=u*u*(3-2*u);c.setAttribute('cx',A[0]+(B[0]-A[0])*u);c.setAttribute('cy',A[1]+(B[1]-A[1])*u);requestAnimationFrame(step);})(performance.now());});}
function pulse(d,delay){const f=$('fly');if(!f)return;const NS='http://www.w3.org/2000/svg',p=document.createElementNS(NS,'path');p.setAttribute('d',d);p.setAttribute('fill','none');f.appendChild(p);const L=p.getTotalLength(),c=document.createElementNS(NS,'circle');c.setAttribute('r',5);c.setAttribute('fill',C.terra);c.setAttribute('stroke',C.ink);f.appendChild(c);const t0=performance.now()+(delay||0),D=Math.max(700,L*3.2);
 (function st(now){const u=(now-t0)/D;if(u<0){requestAnimationFrame(st);return;}if(u>=1){c.remove();p.remove();return;}const q=p.getPointAtLength(L*u);c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);requestAnimationFrame(st);})(performance.now());}
// a pulse runs along a wire only when work really moves: a slice taken, built, checked, passed, committed, or sent back
function moved(m){const t=m.text,a=m.from,P=POS,say=(x,sec)=>{NOW[a]={text:x,until:Date.now()+sec*1000};lastSvg='';},seq=(...ds)=>ds.forEach((d,i)=>d&&pulse(d,i*520)),ping=k=>{const e=$('n_'+k);if(e){e.classList.remove('ping');void e.getBBox();e.classList.add('ping');}},ch=P.chief,mg=P.manager,ws=(ST.agents||[]).filter(x=>x.role=='worker'),vs=(ST.agents||[]).filter(x=>x.role=='verifier');
 if(a=='queue'||/^new slice/.test(t)){ping('queue');seq(ch&&hc(QOUT,ch),ch&&hc(ch,HW));ws.forEach(x=>pulse(ln(HW,P[x.name]),1040));return;}
 if(!P[a])return;
 if(/\btook\b/.test(t)){say('taking a new slice',20);seq(ch&&hc(QOUT,ch),ch&&mg&&hc(ch,mg),mg&&hc(mg,HW),ln(HW,P[a]));}
 else if(/\bbuilt\b/.test(t)){say('handing in work',45);seq(ln(P[a],HW),ln(HW,HV));vs.forEach(x=>pulse(ln(HV,P[x.name]),1040));}
 else if(/committed/.test(t)){say('handing in checked work',45);seq(ln(P[a],HW),ln(HW,HV),hc(HV,PIN),TOMAIN);setTimeout(()=>ping('product'),1500);}
 else if(/verdict/.test(t)){say('giving a verdict',30);if(/holds/.test(t)&&!/does not hold/.test(t))seq(ln(P[a],HV),hc(HV,PIN));else seq(ln(P[a],HV),LOOP);}
 else if(/checking/.test(t)){say('checking work',30);seq(ln(HW,HV),ln(HV,P[a]));}
 else if(/back|queued/.test(t))pulse(LOOP);}
function feedAdd(m,isNew){const f=$('feed'),d=document.createElement('div');d.className='m'+(m.auto?' a':'')+(isNew?' new':'');d.innerHTML=`<span class='hm'>${m.hm}</span>${chip(m.from)}→ ${chip(m.to)}${esc(m.text)}`;f.prepend(d);while(f.children.length>160)f.lastChild.remove();}
function rate(){const now=Date.now()/1000;$('rate').textContent=MSG.filter(m=>now-m.t<60).length+' a minute';if(ST.agents)charts();}
const es=new EventSource('/events');es.onopen=()=>{$('live').style.background=C.sage;};es.onerror=()=>{$('live').style.background=C.terra;};
es.addEventListener('init',e=>{const d=JSON.parse(e.data);ST=d.slow;PU=d.pulse;MSG=d.msgs;$('feed').innerHTML='';MSG.slice(-90).forEach(m=>feedAdd(m,false));draw();rate();});
es.addEventListener('slow',e=>{ST=JSON.parse(e.data);draw();});es.addEventListener('pulse',e=>{PU=JSON.parse(e.data);draw();});
es.addEventListener('msg',e=>{const m=JSON.parse(e.data);MSG.push(m);feedAdd(m,true);if(m.auto){moved(m);draw();}else fly(m);rate();});setInterval(()=>{lastSvg='';draw();},15000);setInterval(rate,5000);
</script>
