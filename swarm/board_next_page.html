 if(fx=='stars'){let s='';for(let k=0;k<Math.round(box.w*box.h/9000);k++){const a=Math.sin((i+1)*991+k*12.9898)*43758.5453,b=Math.sin((i+1)*577+k*78.233)*12345.678;s+=`<circle cx='${f1(box.x+(a-Math.floor(a))*box.w)}' cy='${f1(box.y+(b-Math.floor(b))*box.h)}' r='${f1(.5+((a*7)%1+1)%1*1.1)}' fill='#f5e9dc' opacity='.5'/>`;}return s;}

 <div class='card'><h2>Queue load</h2>${qbar(S)}<div style='margin:8px 0;font-size:13px'><b>${S.q.nbuilt}</b> built · <b>${S.q.nprog}</b> in work · <b>${S.q.nready}</b> ready</div>${wpill(S)} <small>${esc(S.warn.text)}</small><div style='margin-top:10px;font-size:12.5px'>runway = ready ÷ workers = ${S.q.nready} ÷ ${S.workers} = <b>${S.runway}</b> rounds</div></div>
 <div class='card'><h2>Messages <small class='mu'>· newest first</small></h2><div class='feed' style='max-height:250px'>${feed(S.msgs.slice(-60).reverse())}</div></div></div>
 <div class='card' style='margin-top:16px'><h2>Slices</h2><div class='lanes'>${lanes.map(([t,n,L])=>`<div class='lane'><b>${t}</b> <small>${n}</small><div>${L.join('')||'<small>none</small>'}</div></div>`).join('')}</div></div>
 ${charts(S)}<div class='card' style='margin-top:16px'><details><summary>Ledger, newest last</summary><pre>${esc(S.ledger.join('\n'))}</pre></details></div>`;}
function viewFleet(){const L=D.swarms,A=L.reduce((s,x)=>s+x.agents.length,0),lv=L.reduce((s,x)=>s+x.live,0),rd=L.reduce((s,x)=>s+x.q.nready,0),pg=L.reduce((s,x)=>s+x.q.nprog,0),bt=L.reduce((s,x)=>s+x.q.nbuilt,0),wn=L.filter(x=>x.warn.level=='bad'||x.warn.level=='warn');
 const lede=`${L.length} swarm${L.length>1?'s':''} under one main session · ${L.filter(x=>x.status=='finished').length} finished · ${L.filter(x=>x.status=='stalled').length} stalled${wn.length?` · <b style='color:var(--bad)'>needs you: ${wn.map(x=>esc(x.name)).join(', ')}</b>`:''}`;
 const kp=kpi(lv+'<small style="font-size:14px"> / '+A+'</small>','agents working')+kpi(rd,'ready')+kpi(pg,'in work')+kpi(bt,'built')+kpi(wn.length,'queues to look at',wn.length?'bad':'');
 const rows=L.map((S,i)=>{const last=S.msgs.filter(m=>!m.auto).slice(-1)[0]||S.msgs.slice(-1)[0];return `<tr class='r' data-view='${esc(S.name)}'><td><b class='tt' style='color:${pal(i)};font-size:15px'>${esc(S.name)}</b><br><span class='pill ${S.status=='finished'?'done':S.status=='stalled'?'bad':S.status=='busy'?'ok':''}'>${S.status}</span></td>
  <td style='min-width:190px'>${esc(cut(S.goal.text,40))}${goalBar(S)}<small>${S.goal.done??'?'} of ${S.goal.total??'?'}</small></td><td><div class='dots'>${S.agents.map(a=>`<i class='${a.state}' title='${esc(cname(a)+' ('+roleT(a)+'): '+a.state)}'></i>`).join('')}</div><small>${S.live} of ${S.agents.length} working · ${S.workers}w</small></td>
  <td style='min-width:170px'>${qbar(S)}<small>${S.q.nbuilt} built · ${S.q.nprog} in work · ${S.q.nready} ready</small><br>${wpill(S)}</td><td style='width:210px'>${river(S,200,14,false)}</td><td style='max-width:260px'><small title='${last?esc(last.raw):''}'>${last?esc(last.hm+'  '+(last.auto?'':last.fn+' → '+last.tn+': ')+cut(last.text,80)):''}</small></td></tr>`;}).join('');
 const all=L.flatMap((S,i)=>S.msgs.map(m=>({...m,si:i,sn:S.name}))).sort((a,b)=>b.t-a.t).slice(0,90);
 const tot={};STG.forEach(([k])=>tot[k]=L.reduce((s,x)=>s+x.stages[k],0));
 return header(esc(D.title||'Swarm fleet'),lede,kp)+controls()+graphFleet()+legend()+`<div id='strip' class='card'></div>
 <div class='card' style='margin-top:14px'><h2>Load by stage, whole fleet</h2>${river({stages:tot},1260,74,true)}</div>
 <div class='card' style='margin-top:16px'><h2>Swarms <small class='mu'>· click a row or a pool to open that swarm</small></h2><table class='fl'><tr><th>Swarm</th><th>Goal</th><th>Agents</th><th>Queue load</th><th>Stages</th><th>Last word</th></tr>${rows}</table></div>
 <div class='grid g2'><div class='card'><h2>Messages, every swarm <small class='mu'>· newest first</small></h2><div class='feed'>${feed(all,true)}</div></div><div class='card'><h2>Who needs a hand</h2>${wn.length?'':`<p class='mu'>Every queue has at least a round of work; nothing needs you.</p>`}${L.slice().sort((a,b)=>({bad:0,warn:1,ok:2,done:3}[a.warn.level])-({bad:0,warn:1,ok:2,done:3}[b.warn.level])).map((S,i)=>`<div style='display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)'><b class='tt' style='color:${pal(D.swarms.indexOf(S))};min-width:90px'>${esc(S.name)}</b>${wpill(S)}<small>${esc(S.warn.text)}</small></div>`).join('')}</div></div>`;}
// ---------------------------------------------------------------- node tab
function sliceLife(S,id){if(!id)return '';const seen=new Set(),ev=S.msgs.filter(m=>m.auto&&(m.raw||'').includes(id)&&!seen.has(m.kind+m.from)&&seen.add(m.kind+m.from));return ev.map(m=>`<div class='step' title='${esc(m.raw)}'><span class='hm'>${m.hm}</span>${esc(m.text.slice(0,180))}</div>`).join('')||`<small>nothing recorded for it yet</small>`;}
function tabHtml(k){const I=NODEINFO[k];if(!I)return '';const S=I.S,sec=(t,b)=>`<div class='sec'><small class='mu'>${t}</small>${b}</div>`,ml=L=>L.length?feed(L):'<small>none</small>';
 if(I.kind=='agent'){const a=I.a,sl=a.slice||a.check;const msgs=S.msgs.filter(m=>m.from==a.name||m.to==a.name||(m.to=='workers'&&a.role=='worker')||(m.to=='verifiers'&&a.role=='verifier')).slice(-10).reverse();
  return [`<small class='mu'>${esc(roleT(a))} · ${esc(S.name)} · launched by ${esc(cs(S,a.by)||'?')} at ${esc(a.at||'?')}</small><h2 style='font-size:26px;margin:4px 0' title='${esc(a.char?(a.char.aside||'')+(a.char.from?' ('+a.char.from+')':''):'')}'>${esc(cname(a))}</h2><span class='pill ${a.state=='live'?'ok':a.state=='slow'?'warn':''}'>${esc(I.state)}</span> <small>${a.ago!=null?'last action '+(a.ago<1?'just now':a.ago+' min ago'):'no transcript found'}</small>`,
   sec('Doing now',`<div class='now'>${esc(a.tag)}</div>${a.slice?`<small title='${esc(a.slice.id)}'>holds ‘${esc(a.slice.title)}’</small>`:a.check?`<small title='${esc(a.check.id)}'>checking ‘${esc(a.check.tag)}’, built by ${esc(cs(S,a.check.w))} (${esc(a.check.w)})</small>`:''}`)+(sl?sec('Slice life',sliceLife(S,sl.id)):''),
   sec('Recent actions (newest last)',a.acts.map(x=>`<div class='step'>${esc(x)}</div>`).join('')||'<small>none read</small>')+sec('Messages to and from',ml(msgs))];}
 if(I.kind=='queue')return [`<small class='mu'>${esc(S.name)}</small><h2 style='font-size:24px;margin:4px 0'>The queue</h2>${wpill(S)} <small>${esc(S.warn.text)}</small>${qbar(S)}`,sec('In work',S.q.prog.map(p=>`<div class='step' title='${esc(p.id)}'>${chip(p.who,cs(S,p.who))}${esc(p.title)}</div>`).join('')||'<small>none</small>'),sec('Next up',S.q.ready.slice(0,12).map(p=>`<div class='step'><span class='pill'>P${p.p}</span> ${esc(p.title)}${p.from?' <small>from '+esc(p.from)+'</small>':''}</div>`).join('')||'<small>empty</small>')];
 if(I.kind=='stageq'){const Q=S.stageq[I.qk];return [`<small class='mu'>${esc(S.name)}</small><h2 style='font-size:24px;margin:4px 0'>${esc(Q.label[0].toUpperCase()+Q.label.slice(1))}</h2><small>${Q.n} item${Q.n==1?'':'s'}</small>`,sec('Items',Q.items.slice(0,30).map(x=>`<div class='step' title='${esc(x.id)}'>${x.p!=null?`<span class='pill'>P${x.p}</span> `:''}${esc(x.title)}</div>`).join('')||'<small>none</small>')];}
 if(I.kind=='product')return [`<small class='mu'>${esc(S.name)}</small><h2 style='font-size:24px;margin:4px 0'>The product</h2><small>${S.stages.committed} slices committed after a check · ${S.git.n} commits since start · ${S.git.unpushed} wait for main to approve</small>`,sec('Commits',S.git.commits.slice(0,10).map(c=>`<div class='step'><span class='pill ${c.wait?'warn':'ok'}'>${c.wait?'to approve':'pushed'}</span> <span class='hm' title='${esc(c.h)}'>${c.hm}</span>${esc(c.s)}</div>`).join('')||'<small>none</small>'),sec('Latest checks',S.verd.slice(0,10).map(v=>`<div class='step' title='${esc(v.id)}'><span class='hm'>${v.hm}</span>${chip(v.by,cs(S,v.by))}<b>${v.v}</b> ‘${esc(v.title||v.tag)}’</div>`).join('')||'<small>none</small>')];
 if(I.kind=='main'){const L=I.fleet?D.swarms:[S];const ms=L.flatMap(s=>s.msgs.filter(m=>m.from=='main'||m.to=='main').map(m=>({...m,sn:s.name}))).sort((a,b)=>b.t-a.t).slice(0,12);
  return [`<h2 style='font-size:24px;margin:4px 0'>Main session</h2><small>sets the goal, approves and pushes; only main pushes</small>`,sec('Waiting for approval',L.map(s=>`<div class='step'><b>${esc(s.name)}</b> ${s.git.unpushed} commits</div>`).join('')),sec('Messages to and from main',ml(ms))];}
 return [''];}
function openTab(k){SEL=k;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel',n.dataset.k===k));const parts=tabHtml(k);
 if(P.tab=='drawer'){$('drawer').innerHTML=`<button class='x' onclick='closeTab()'>×</button>`+parts.join('');$('drawer').classList.add('on');const s=$('strip');s&&s.classList.remove('on');}
 else{const s=$('strip');if(!s)return;s.innerHTML=`<a style='float:right;cursor:pointer;color:var(--accent)' onclick='closeTab()'>close</a>`+parts[0]+`<div class='cols3'>${parts.slice(1).map(p=>`<div>${p}</div>`).join('')}</div>`;s.classList.add('on');$('drawer').classList.remove('on');s.scrollIntoView({block:'nearest'});}}
function closeTab(){SEL=null;$('drawer').classList.remove('on');const s=$('strip');s&&s.classList.remove('on');document.querySelectorAll('.node.sel').forEach(n=>n.classList.remove('sel'));}
// ---------------------------------------------------------------- pulses: a dot flies once along the real path when something happens
function fly(d,col,delay,r){const f=$('fly'),svg=$('graph');if(!f||!d)return;const t=(svg.getCurrentTime?svg.getCurrentTime():0)+delay;const NS='http://www.w3.org/2000/svg',c=document.createElementNS(NS,'circle');
 c.setAttribute('r',r||5.5);c.setAttribute('style',col=='bead'?'fill:var(--card);stroke:var(--ink);stroke-width:2.5':`fill:${col};stroke:var(--case);stroke-width:1.2`);c.setAttribute('opacity','0');
 c.innerHTML=`<animateMotion dur='1.5s' begin='${t.toFixed(2)}s' fill='freeze' path='${d}' keyPoints='0;1' keyTimes='0;1' calcMode='spline' keySplines='.4 0 .2 1'/><animate attributeName='opacity' values='0;1;1;0' keyTimes='0;.1;.85;1' dur='1.5s' begin='${t.toFixed(2)}s' fill='freeze'/>`;f.appendChild(c);setTimeout(()=>c.remove(),(delay+2)*1000);}
function pulseFor(m,si,S,delay){const K=k=>k=='main'?'main':si+'|'+k,ed=(a,b)=>(EDGES[K(a)+'>'+K(b)]||{}).d,k=m.kind;let path=[];
 if(m.auto){if(k=='took')path=[ed('q','hw'),ed('hw',m.from)];else if(k=='built'&&m.to!='manager')path=[ed(m.from,'hv')];else if(k=='checking')path=[ed('hv',m.from)];
  else if(k=='pass'&&m.to!='chief')path=[ed(m.from,'cq')];else if(k=='back'&&m.to!='chief')path=[EDGES[K('p')+'>'+K('q')]&&EDGES[K('p')+'>'+K('q')].d];else if(k=='committed')path=[ed('cq','p'),ed('p','mq'),ed('mq','main')];else if(k=='new'){const ch=S.agents.find(a=>a.role=='chief');path=[ch&&(ed(ch.name,'q')||ed(ch.name,'gq'))];}
  if(!path.filter(Boolean).length)return 0;}
 path=path.filter(Boolean);if(path.length){path.forEach((d,i)=>fly(d,'bead',delay+i*.9,6));return 1;}
 const a=POS[K(m.from)],b=POS[K(m.to)];if(a&&b&&a!==b){fly(R.chord(a,b,null),'var(--msg)',delay,4.5);return 1;}return 0;}
// on a static page, everything that happened since the last redraw flies once
function replayRecent(){const win=Math.max(D.refresh||0,45),L=VIEW=='fleet'?D.swarms.map((s,i)=>[s,i]):[[swarmBy(VIEW),0]];let k=0;
 L.forEach(([S,si])=>S.msgs.filter(m=>S.as_of-m.t<win).slice(-14).forEach(m=>{if(pulseFor(m,si,S,.2+(k%10)*.32))k++;}));}
// ---------------------------------------------------------------- render
function render(replay){document.body.dataset.skin=P.skin;const S=VIEW=='fleet'?null:swarmBy(VIEW);$('app').innerHTML=S?viewSwarm(S):viewFleet();
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>setPref(b.dataset.p,b.dataset.v));
 document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{VIEW=b.dataset.view;SEL=null;closeTab();syncHash();render();scrollTo(0,0);});
 document.querySelectorAll('.pool').forEach(p=>p.addEventListener('click',e=>{if(e.target.closest('.node'))return;VIEW=p.dataset.s;SEL=null;closeTab();syncHash();render();scrollTo(0,0);}));
 document.querySelectorAll('.node,.tile').forEach(n=>n.addEventListener('click',e=>{e.stopPropagation();openTab(n.dataset.k);}));
 document.querySelectorAll('[data-slice]').forEach(n=>n.onclick=()=>{const S2=S;if(!S2)return;const a=S2.agents.find(a=>a.slice&&a.slice.id==n.dataset.slice);if(a)openTab('0|'+a.name);});
 if(D.live)$('live').style.background='var(--ok)';
 if(SEL&&NODEINFO[SEL])openTab(SEL);if(replay)replayRecent();}
if(P.node)SEL=P.node;syncHash();render(true);
window.addEventListener('hashchange',()=>{const p=prefs();if(p.skin!=P.skin||p.layout!=P.layout||p.tab!=P.tab){P=p;render();}});
// ---- live mode: poll the small server; new messages fly the moment they show up
if(D.live){let last=Object.fromEntries(D.swarms.map(s=>[s.name,s.msgs.length?s.msgs[s.msgs.length-1].t:0])),sig='';
 const sigOf=d=>JSON.stringify(d.swarms.map(s=>[s.name,s.agents.map(a=>a.state+a.tag),s.stages,s.q.nready,s.nmsgs,s.git]));sig=sigOf(D);
 setInterval(async()=>{try{const r=await fetch('state.json?'+Date.now());const nd=await r.json(),ns=sigOf(nd);Object.assign(D,nd);if(ns!=sig){sig=ns;const sel=SEL;render(false);if(sel&&NODEINFO[sel])openTab(sel);}let k=0;
  D.swarms.forEach((s,si)=>{const lt=last[s.name]||0;if(VIEW=='fleet'||VIEW==s.name)s.msgs.filter(m=>m.t>lt).slice(-12).forEach(m=>pulseFor(m,VIEW=='fleet'?si:0,s,(k++)*.3));last[s.name]=s.msgs.length?s.msgs[s.msgs.length-1].t:lt;});$('live').style.background='var(--ok)';}catch(e){const l=$('live');l&&(l.style.background='var(--bad)');}},2500);}
</script>
